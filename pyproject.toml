[project]
name = "home-audio-buttons"
version = "0.1.0"
description = "Control Home Assistant media players from a USB 3-button + knob keypad"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "pynput>=1.7; sys_platform == 'darwin'",  # Mac: keyboard listener
    "evdev>=1.6; sys_platform == 'linux'",    # Pi: read the keypad device directly
]

[project.scripts]
buttons = "buttons:main"
keypad = "keypad:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["buttons", "keypad"]
